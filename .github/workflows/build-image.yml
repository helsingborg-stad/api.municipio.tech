name: Build Docker image

on:
  push:
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (for example, v1.2.3 or 1.2.3-rc.1)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/helsingborg-stad/api.municipio.tech
  IMAGE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

concurrency:
  group: build-image-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected revision
        uses: actions/checkout@v4

      - name: Validate image tag and build secret
        env:
          ACF_PRO_KEY: ${{ secrets.ACF_PRO_KEY }}
        run: |
          bash .docker/scripts/validate-image-tag.sh "$IMAGE_TAG"
          if [ -z "$ACF_PRO_KEY" ]; then
            echo 'ACF_PRO_KEY repository secret is required.' >&2
            exit 1
          fi

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse existing image tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: bash .docker/scripts/check-image-tag.sh

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - name: Check out selected revision
        uses: actions/checkout@v4

      - name: Prepare tracked build context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/image-context"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/image-context"
          test -f "$RUNNER_TEMP/image-context/.docker/Dockerfile"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.platform }} by digest
        id: build
        uses: docker/build-push-action@v6
        env:
          ACF_PRO_KEY: ${{ secrets.ACF_PRO_KEY }}
        with:
          context: ${{ runner.temp }}/image-context
          file: ${{ runner.temp }}/image-context/.docker/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          secret-envs: |
            acf_pro_key=ACF_PRO_KEY

      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected revision
        uses: actions/checkout@v4

      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse existing image tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: bash .docker/scripts/check-image-tag.sh

      - name: Publish multi-platform image
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/digests"
          sources=()
          for digest in *; do
            sources+=("$IMAGE_NAME@sha256:$digest")
          done
          if [ "${#sources[@]}" -ne 2 ]; then
            echo 'Expected digests for both image platforms.' >&2
            exit 1
          fi
          docker buildx imagetools create -t "$IMAGE_NAME:$IMAGE_TAG" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE_NAME:$IMAGE_TAG"